name: Temporary WIN10 Native Build Check

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run the native Windows 10 build and test suite"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows 10 native build and tests
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Visual Studio MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install MSVC Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
          cache: false

      - name: Verify native compiler and Rust target
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List

          Write-Host "`n=== MSVC ==="
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          $link = Get-Command link.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe is not available after Visual Studio setup." }
          if (-not $link) { throw "link.exe is not available after Visual Studio setup." }
          Write-Host "CL: $($cl.Source)"
          Write-Host "LINK: $($link.Source)"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host "WindowsSdkDir: $env:WindowsSdkDir"

          Write-Host "`n=== RUST ==="
          rustc -vV
          cargo --version
          rustup show
          if ((rustc -vV | Select-String '^host: x86_64-pc-windows-msvc$') -eq $null) {
            throw "The active Rust host is not x86_64-pc-windows-msvc."
          }

          Write-Host "`n=== NODE ==="
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Core Clippy
        run: cargo clippy -p forgedesk-core --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p forgedesk-core

      - name: Build native Tauri application
        run: cargo build -p forgedesk

      - name: Check Tauri application with optional AI feature
        run: cargo check -p forgedesk --features ai-extension

      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forgedesk-win10-debug
          path: target/debug/forgedesk.exe
          if-no-files-found: error
