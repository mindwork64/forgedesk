name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux keyring build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy -p forgedesk-core --all-targets -- -D warnings
      - run: cargo test -p forgedesk-core

  tauri-linux:
    name: Tauri shell (Linux compile)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo check -p forgedesk

  tauri-windows:
    name: Tauri shell (Windows compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo check -p forgedesk

  visual-gate-0:
    name: UI visual gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build with deterministic visual harness
        run: npm run build
        env:
          VITE_VISUAL_HARNESS: 'true'
      - name: Run UI Gate 0
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null
          node scripts/visual-gate0.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-gates
          path: |
            docs/ui/current/
          if-no-files-found: error
