[workspace]
resolver = "2"
members = ["crates/forgedesk-ai", "crates/forgedesk-core", "src-tauri"]
# The Tauri shell requires OS webview development libraries. The core crate is
# independently buildable/testable so CI and developers can verify domain and
# storage logic without a desktop toolchain.
default-members = ["crates/forgedesk-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6.3", features = ["sync-secret-service", "windows-native", "apple-native", "crypto-rust"] }
